name: Preparar backend recebido para dev

on:
  push:
    branches: [feature/substituir-backend-recebido]
    paths:
      - '.github/workflows/preparar-backend-recebido.yml'

permissions:
  contents: write

jobs:
  preparar:
    if: github.repository == 'LucasNPADev/projetoFinal_Lume'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Importar backend limpo, fixar dependencias e criar migration inicial
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lume_dev?schema=public
          JWT_SECRET: 'CI-TESTES-SOMENTE-NAO-E-SEGREDO-32-CHARS'
        run: |
          set -euo pipefail
          echo '0a6dc69344aa2fa3ef422cf7d72f32309a290df265cc09aaf4fa6f687dc5d3f9  .github/backend-import/source.tar.gz' | sha256sum -c -
          rm -rf backend
          mkdir -p backend
          tar -xzf .github/backend-import/source.tar.gz -C backend --no-same-owner
          test ! -e backend/.env
          test ! -d backend/node_modules
          cd backend
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run prisma:generate
          mkdir -p prisma/migrations/20261008190000_backend_substituido
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261008190000_backend_substituido/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          test -s prisma/migrations/20261008190000_backend_substituido/migration.sql
          npm run typecheck
          npm run build
          npm run insomnia:validate
          npm test
          cd ..
          rm -rf .github/backend-import
          rm .github/workflows/preparar-backend-recebido.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backend .github/backend-import .github/workflows/preparar-backend-recebido.yml
          git commit -m "feat(backend): substitui por backend recebido, lockfile e migration para banco novo"
          git push origin HEAD:feature/substituir-backend-recebido

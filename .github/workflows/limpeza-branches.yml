name: Limpeza unica de branches legadas

# A execucao ocorre somente quando este workflow e introduzido na main.
# Nao se repete em pushes comuns: o filtro paths e exato.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limpeza-branches.yml'

permissions:
  contents: write

jobs:
  apagar-antigas:
    name: Remover develop e branches mescladas
    if: github.repository == 'LucasNPADev/projetoFinal_Lume'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirmar integridade e apagar somente refs autorizadas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as sleep } from 'node:timers/promises';

          const repo = process.env.GH_REPOSITORY;
          const api = async (url, options = {}) => {
            const resp = await fetch('https://api.github.com/repos/' + repo + url, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28',
                ...options.headers
              }
            });
            if (!resp.ok) {
              const body = await resp.text();
              throw Error(options.method + ' ' + url + ' (' + resp.status + '): ' + body.slice(0, 400));
            }
            return resp.status === 204 ? null : resp.json();
          };

          const legacy = {
            develop: 'be0e02e1156b528ab1e39f5fde3eb74c56c697df',
            'feature/insomnia-rotas-backend': 'f2cd8b09cef7238f6ed828d72bf38c2708fe9448',
            'release/1.1.0': '7db5a6750b4607025308d867888ba93a2d62cbeb'
          };

          // Evita perda de codigo: so apaga quando a versao de main e dev
          // e identica, e os PRs #3 e #4 estao mesclados.
          for (const pr of [3, 4]) {
            const info = await api('/pulls/' + pr);
            if (!info.merged_at) throw Error('PR #' + pr + ' ainda nao mesclado');
          }
          let synced = false;
          for (let i = 0; i < 36; i++) {
            const [main, dev] = await Promise.all([
              api('/branches/main'), api('/branches/dev')
            ]);
            if (main.commit.sha === dev.commit.sha) {
              synced = true;
              console.log('main e dev sincronizadas em ' + main.commit.sha);
              break;
            }
            await sleep(5000);
          }
          if (!synced) throw Error('main e dev divergentes; nenhuma branch sera removida.');

          const branches = await api('/branches?per_page=100');
          const current = new Map(branches.map(b => [b.name, b.commit.sha]));
          const extras = [...current.keys()].filter(
            b => b !== 'main' && b !== 'dev' && !(b in legacy));
          if (extras.length) throw Error('Branches desconhecidas; interrompendo: ' + extras.join(', '));
          for (const [branch, expected] of Object.entries(legacy)) {
            if (!current.has(branch)) continue;
            if (current.get(branch) !== expected) {
              throw Error('Branch antiga mudou; cancelando a limpeza: ' + branch);
            }
          }
          for (const branch of Object.keys(legacy)) {
            if (current.has(branch)) {
              await api('/git/refs/heads/' + branch, {method:'DELETE'});
              console.log('Branch antiga apagada: ' + branch);
            }
          }
          const remaining = await api('/branches?per_page=100');
          const names = remaining.map(b => b.name).sort();
          if (JSON.stringify(names) !== JSON.stringify(['dev','main'])) {
            throw Error('Conferencia final: branches ainda presentes ' + names.join(', '));
          }
          console.log('OK: somente main e dev permanecem.');
          NODE

name: Backend - build e integracao

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lume_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lume_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lume_ci?schema=public
      JWT_SECRET: ci-only-secret-not-for-production-CHANGE-ME-0123456789
      NODE_ENV: test
      SEED_DEMO: 'true'
      RUN_INTEGRATION_TESTS: '1'
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias do backend
        run: npm install --no-audit --no-fund
      # Etapa temporaria para gerar um lockfile reproduzivel a partir do npm real
      - name: Exportar dependencias resolvidas (geracao inicial do lock)
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('package-lock.json', 'utf8');
          const lock = JSON.stringify(JSON.parse(raw));
          console.log('LUMELOCKBEGIN');
          for (let i = 0; i < lock.length; i += 5000) {
            console.log('LUMELOCKPART:' + String(i / 5000).padStart(5, '0') + ':' + lock.slice(i, i + 5000));
          }
          console.log('LUMELOCKEND');
          NODE
      - name: Validar JSON da colecao Postman
        run: node -e "JSON.parse(require('node:fs').readFileSync('postman.collection.json','utf8'))"
      - name: Validar colecao Insomnia e cobertura dos endpoints
        run: npm run insomnia:validate
      - name: Gerar Prisma Client
        run: npm run prisma:generate
      - name: Aplicar migrations reais
        run: npm run prisma:deploy
      - name: Seed sintetico
        run: npm run prisma:seed
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Compilar backend
        run: npm run build
      - name: Testes unitarios e API/PostgreSQL
        run: npm test

name: Backend - build e integracao

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lume_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lume_ci?schema=public
      JWT_SECRET: CI-SOMENTE-PARA-TESTES-COM-SEGREDO-FICTICIO-MAIOR-QUE-32-CARACTERES
      JWT_EXPIRES_IN: 15m
      ADMIN_NOME: Administrador Teste
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_SENHA: senha-ficticia-para-testes-123456
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar Prisma Client
        run: npm run prisma:generate
      - name: Aplicar migration em banco PostgreSQL novo
        run: npm run prisma:deploy
      - name: Criar admin de teste no banco descartavel
        run: npm run seed
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Compilar API
        run: npm run build
      - name: Validar colecao Insomnia
        run: npm run insomnia:validate
      - name: Testes de API
        # A entrega de e-mail é substituída por mock no CT005; não há envio real.
        env:
          NODE_ENV: test
          EMAIL_MODE: smtp
          SMTP_HOST: smtp.invalid
          SMTP_PORT: '587'
          SMTP_USER: testes@lume.test
          SMTP_PASSWORD: senha-ficticia-exclusiva-ci
          EMAIL_FROM: 'LUME Testes <testes@lume.test>'
          FRONTEND_URL: http://localhost:3000
        run: npm test

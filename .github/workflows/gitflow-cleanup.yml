name: GitFlow - limpar branches temporarias

# PR fechado usa workflow da branch principal; nunca faz checkout de PR externo.
# O push e usado uma vez, quando este arquivo entra pela primeira vez na main,
# para remover branches temporarias ja mescladas durante esta configuracao.
on:
  pull_request_target:
    branches: [main, dev]
    types: [closed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/gitflow-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: gitflow-limpeza-branches
  cancel-in-progress: false

jobs:
  limpeza:
    if: >-
      github.repository == 'LucasNPADev/projetoFinal_Lume' &&
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Remover apenas branches temporarias com PR mesclado
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const repo = process.env.GH_REPOSITORY;
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const allowed = /^(?:feature|bugfix|chore|docs|refactor|test|ci|release|hotfix)\/[a-z0-9][a-z0-9._-]*$/;
          const api = async (path, opts = {}) => {
            const response = await fetch('https://api.github.com/repos/' + repo + path, {
              method: opts.method || 'GET',
              headers: {
                'Accept': 'application/vnd.github+json',
                'Authorization': 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (response.status === 404 && opts.allow404) return null;
            if (!response.ok) throw Error((opts.method || 'GET') + ' ' + path + ': ' + response.status + ' ' + (await response.text()).slice(0, 300));
            return response.status === 204 ? null : response.json();
          };
          const possible = new Map();
          if (process.env.GH_EVENT_NAME === 'pull_request_target') {
            const p = event.pull_request;
            if (p?.merged_at && p.head.repo?.full_name === repo && ['main', 'dev'].includes(p.base.ref)) {
              possible.set(p.head.ref, p.head.sha);
            }
          } else {
            // Primeira publicacao: recolhe branches de PRs ja integrados.
            const prs = await api('/pulls?state=closed&per_page=100');
            for (const p of prs) {
              if (p.merged_at && p.head.repo?.full_name === repo && ['main','dev'].includes(p.base.ref)) {
                possible.set(p.head.ref, p.head.sha);
              }
            }
          }
          const branchList = await api('/branches?per_page=100');
          const refs = new Map(branchList.map(b => [b.name, b]));
          for (const [name, expected] of possible) {
            if (name === 'main' || name === 'dev' || !allowed.test(name)) continue;
            const branch = refs.get(name);
            if (!branch || branch.protected || branch.commit.sha !== expected) {
              console.log('Mantida, ausente/protegida/divergente: ' + name);
              continue;
            }
            // Conferir mais uma vez antes de excluir, sem tocar em main/dev.
            const latest = await api('/branches/' + name, {allow404:true});
            if (!latest || latest.protected || latest.commit.sha !== expected) continue;
            await api('/git/refs/heads/' + name, {method:'DELETE', allow404:true});
            console.log('Removida apos PR mesclado: ' + name);
          }
          console.log('Limpeza encerrada; main e dev preservadas.');
          NODE

name: GitFlow - etiquetar versoes

# Workflow com codigo confiavel da main (nao faz checkout do PR).
on:
  pull_request_target:
    branches: [main]
    types: [closed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/gitflow-tag-release.yml'

permissions:
  contents: write

concurrency:
  group: gitflow-tag-release
  cancel-in-progress: false

jobs:
  tag-release:
    if: >-
      github.repository == 'LucasNPADev/projetoFinal_Lume' &&
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Conferir versao e criar tag anotada sem sobrescrever tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_EVENT_PATH: ${{ github.event_path }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const repo = process.env.GH_REPOSITORY;
          const ev = JSON.parse(readFileSync(process.env.GH_EVENT_PATH, 'utf8'));
          const api = async (path, opts = {}) => {
            const res = await fetch('https://api.github.com/repos/' + repo + path, {
              method: opts.method || 'GET',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(opts.body ? {'Content-Type':'application/json'} : {})
              },
              body: opts.body && JSON.stringify(opts.body)
            });
            if (opts.allow404 && res.status === 404) return null;
            if (!res.ok) throw Error((opts.method || 'GET') + ' ' + path + ' (' + res.status + '): ' + (await res.text()).slice(0,300));
            return res.status === 204 ? null : res.json();
          };
          const candidates = [];
          if (process.env.GH_EVENT_NAME === 'pull_request_target') {
            const p = ev.pull_request;
            if (p?.merged_at && p.base.ref === 'main' && p.head.repo?.full_name === repo) candidates.push(p);
          } else {
            const prs = await api('/commits/' + ev.after + '/pulls?per_page=100');
            candidates.push(...prs.filter(p => p.merged_at && p.base.ref === 'main' && p.head.repo?.full_name === repo && p.merge_commit_sha === ev.after));
          }
          for (const p of candidates) {
            const match = /^release\/v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/.exec(p.head.ref);
            if (!match) { console.log('Nao e PR de release versionada: ' + p.head.ref); continue; }
            const version = match[1];
            const sha = p.merge_commit_sha;
            if (!sha) throw Error('PR sem SHA do commit de merge.');
            const payload = await api('/contents/backend/package.json?ref=' + sha);
            const packageVersion = JSON.parse(Buffer.from(payload.content, 'base64').toString('utf8')).version;
            if (packageVersion !== version) throw Error('Versao do package.json ' + packageVersion + ' nao coincide com ' + version);
            const ref = 'v' + version;
            const existing = await api('/git/ref/tags/' + ref, {allow404:true});
            if (existing) {
              // Tag anotada aponta ao objeto tag, que por sua vez aponta ao commit.
              let target = existing.object.sha;
              if (existing.object.type === 'tag') {
                const tagObj = await api('/git/tags/' + target);
                target = tagObj.object.sha;
              }
              if (target !== sha) throw Error('Tag ' + ref + ' ja existe em outro commit: ' + target);
              console.log('Tag ' + ref + ' ja correta em ' + sha);
              continue;
            }
            const tagObj = await api('/git/tags', {
              method:'POST', body:{tag:ref, message:'LUME ' + ref + ' - versao validada por CI', object:sha, type:'commit'}
            });
            await api('/git/refs', {method:'POST', body:{ref:'refs/tags/' + ref, sha:tagObj.sha}});
            console.log('Tag anotada criada: ' + ref + ' -> ' + sha);
          }
          NODE

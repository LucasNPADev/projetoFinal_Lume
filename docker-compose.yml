services:
  postgres:
    image: postgres:16-alpine
    container_name: lume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lume
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lume_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lume"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: lume-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lume?schema=public
      PORT: 3333
      JWT_SECRET: lume-local-development-secret
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: lume-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3333/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  lume_postgres_data:
